name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      catalog-postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_USER: catalog_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: catalog_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U catalog_test -d catalog_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: Catalog integration (disposable database)
        env:
          CARTSIDE_TEST_DATABASE_URL: postgres://catalog_test:disposable_ci_password@127.0.0.1:${{ job.services.catalog-postgres.ports[5432] }}/catalog_test?sslmode=disable
        run: go test -tags=integration -race ./internal/catalogseed -run TestCatalogLifecycle -count=1 -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  configuration:
    name: Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - run: python -m pip install -r scripts/requirements-ci.txt
      - name: Parse committed JSON and YAML
        run: python scripts/validate-config.py
      - name: Validate deployment boundaries
        run: python scripts/check-deployment.py
      - name: Validate monitoring configuration and alert behavior
        run: python scripts/verify-alerts.py
      - name: Validate Compose without rendering secrets
        env:
          POSTGRES_USER: ci_app
          POSTGRES_PASSWORD: ci_disposable_postgres_password
          POSTGRES_DB: ci_app
          KEYCLOAK_DB_PASSWORD: ci_disposable_keycloak_password
          KEYCLOAK_ADMIN_USERNAME: ci_admin
          KEYCLOAK_ADMIN_PASSWORD: ci_disposable_admin_password
          CARTSIDE_OIDC_CLIENT_SECRET: ci_disposable_client_secret
          CARTSIDE_AI_SERVICE_KEY: ci_disposable_ai_service_key_32_bytes
          CARTSIDE_SESSION_SECRET: ci_disposable_session_secret_32_bytes
        run: docker compose config --quiet
