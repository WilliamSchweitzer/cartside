# Supply certificates out of band. This server never requests certificates.
server {
    listen 8443 ssl default_server;
    ssl_certificate /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    server_name _;
    access_log off;
    error_log /dev/stderr crit;
    location = /edge-health { return 200 "ok"; }
    location / { return 404; }
}
server {
    listen 8443 ssl;
    server_name cartside.wschweitzer.com;
    ssl_certificate /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    access_log off;
    error_log /dev/stderr crit;
    location ~ ^/(internal|metrics|apisix|admin)(/|$) { return 404; }
    location / {
        proxy_pass http://apisix:9080;
        proxy_set_header Host cartside.wschweitzer.com;
        proxy_set_header X-Forwarded-Host cartside.wschweitzer.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
    }
}
server {
    listen 8443 ssl;
    server_name auth.cartside.wschweitzer.com;
    ssl_certificate /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    access_log off;
    error_log /dev/stderr crit;
    location / { return 404; }
    location ~ ^/(realms/cartside/|resources/) {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host auth.cartside.wschweitzer.com;
        proxy_set_header X-Forwarded-Host auth.cartside.wschweitzer.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
    }
}
