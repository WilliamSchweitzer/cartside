global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s
scrape_configs:
  - job_name: cartside-api
    static_configs:
      - targets: ['host.docker.internal:9091']
  - job_name: cartside-gateway
    metrics_path: /apisix/prometheus/metrics
    static_configs:
      - targets: ['apisix:9091']
    metric_relabel_configs:
      # Mock usage is synthetic; never retain token/cost series.
      - source_labels: [__name__]
        regex: 'apisix_llm_.*'
        action: drop
