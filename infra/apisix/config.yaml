apisix:
  node_listen: 9080
  enable_admin: false
  enable_control: true
  control:
    ip: 127.0.0.1
    port: 9090
  ssl:
    enable: false

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

nginx_config:
  worker_processes: 1
  # Docker environment alone is insufficient: preserve these in Nginx workers.
  envs:
    - CARTSIDE_OIDC_CLIENT_SECRET
    - CARTSIDE_SESSION_SECRET
  # OIDC errors and default access logs can include codes/provider responses.
  error_log_level: crit
  http:
    enable_access_log: false

plugins:
  - proxy-rewrite
  - openid-connect
  - serverless-pre-function
  - serverless-post-function
stream_plugins: []
