# Independent deployment project; never combine with compose.yaml.
services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - postgres_socket:/var/run/postgresql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    platform: linux/arm64
    restart: unless-stopped
    networks:
    - private
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  keycloak-db:
    image: postgres:17.10-bookworm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: /var/run/postgresql
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
    - postgres_socket:/var/run/postgresql
    - ./infra/keycloak/provision-db.sh:/provision-db.sh:ro
    entrypoint:
    - /bin/sh
    - /provision-db.sh
    restart: 'no'
    platform: linux/arm64
    networks:
    - private
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command:
    - start
    - --import-realm
    depends_on:
      keycloak-db:
        condition: service_completed_successfully
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME
        in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD
        in .env}
      CARTSIDE_OIDC_CLIENT_SECRET: ${CARTSIDE_OIDC_CLIENT_SECRET:?Set CARTSIDE_OIDC_CLIENT_SECRET
        in .env}
      KC_HOSTNAME: https://auth.cartside.wschweitzer.com
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx768m
      KC_HOSTNAME_STRICT: 'true'
    volumes:
    - ./infra/deploy/realm.json:/opt/keycloak/data/import/cartside-realm.json:ro
    - ./infra/keycloak/healthcheck.sh:/opt/keycloak/healthcheck.sh:ro
    healthcheck:
      test:
      - CMD
      - bash
      - /opt/keycloak/healthcheck.sh
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
    platform: linux/arm64
    restart: unless-stopped
    networks:
    - private
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  mock-ai:
    build:
      context: .
      dockerfile: infra/mock-ai.Dockerfile
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - /mock-ai
      - -probe
      - http://127.0.0.1:8090/health
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    platform: linux/arm64
    restart: unless-stopped
    networks:
    - private
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: cartside-mock:${IMAGE_TAG:?Set IMAGE_TAG}
  apisix:
    image: apache/apisix:3.19.0-ubuntu
    environment:
      CARTSIDE_OIDC_CLIENT_SECRET: ${CARTSIDE_OIDC_CLIENT_SECRET:?Set CARTSIDE_OIDC_CLIENT_SECRET
        in .env}
      CARTSIDE_SESSION_SECRET: ${CARTSIDE_SESSION_SECRET:?Set CARTSIDE_SESSION_SECRET
        in .env}
      CARTSIDE_AI_SERVICE_KEY: ${CARTSIDE_AI_SERVICE_KEY:?Set CARTSIDE_AI_SERVICE_KEY
        in .env}
    depends_on:
      mock-ai:
        condition: service_healthy
    volumes:
    - ./infra/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    - ./infra/deploy/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    - ./infra/apisix/ai-guard.lua:/usr/local/apisix/ai-guard.lua:ro
    - ./infra/apisix/healthcheck.lua:/usr/local/apisix/healthcheck.lua:ro
    healthcheck:
      test:
      - CMD
      - resty
      - -I
      - /usr/local/apisix/deps/share/lua/5.1
      - /usr/local/apisix/healthcheck.lua
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    platform: linux/arm64
    restart: unless-stopped
    networks:
    - private
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  api:
    platform: linux/arm64
    restart: unless-stopped
    networks:
    - private
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: cartside-api:${IMAGE_TAG:?Set IMAGE_TAG}
    build:
      context: ./backend
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      HTTP_ADDR: :8080
      BROWSER_ORIGIN: https://cartside.wschweitzer.com
      OIDC_ISSUER: https://auth.cartside.wschweitzer.com/realms/cartside
      OIDC_AUDIENCE: cartside-api
      OIDC_JWKS_URL: http://keycloak:8080/realms/cartside/protocol/openid-connect/certs
      CARTSIDE_ASSISTANT_ENABLED: 'true'
      CARTSIDE_AI_GATEWAY_URL: http://apisix:9080/internal/ai/chat/completions
      CARTSIDE_AI_SERVICE_KEY: ${CARTSIDE_AI_SERVICE_KEY:?Set AI service key}
      METRICS_ADDR: :9091
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://127.0.0.1:8080/health/ready
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    platform: linux/arm64
    restart: unless-stopped
    networks:
    - private
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: cartside-frontend:${IMAGE_TAG:?Set IMAGE_TAG}
    build:
      context: ./frontend
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8080/
      interval: 10s
      timeout: 3s
      retries: 5
  edge:
    platform: linux/arm64
    restart: unless-stopped
    networks:
    - private
    - ingress
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: nginxinc/nginx-unprivileged:1.30.1-alpine
    ports:
    - ${EDGE_BIND:-127.0.0.1}:${HTTPS_PORT:-443}:8443
    volumes:
    - ./infra/deploy/edge.conf:/etc/nginx/conf.d/default.conf:ro
    - ./.deploy/certs:/certs:ro
    depends_on:
      apisix:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --no-check-certificate
      - -q
      - -O
      - /dev/null
      - https://127.0.0.1:8443/edge-health
      interval: 30s
      timeout: 3s
      retries: 3
  prometheus:
    image: prom/prometheus:v3.13.1
    profiles:
    - observability
    command:
    - --config.file=/etc/prometheus/prometheus.yaml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=7d
    - --storage.tsdb.retention.size=1GB
    volumes:
    - ./infra/deploy/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    - ./infra/observability/rules:/etc/prometheus/rules:ro
    - prometheus_data:/prometheus
    platform: linux/arm64
    restart: unless-stopped
    networks:
    - private
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:9090/-/ready
      interval: 30s
      timeout: 3s
      retries: 5
  grafana:
    image: grafana/grafana:13.2.3
    profiles:
    - observability
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-local-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
    - grafana_data:/var/lib/grafana
    - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    - ./.deploy/grafana_admin_password:/run/secrets/grafana_admin_password:ro
    platform: linux/arm64
    restart: unless-stopped
    networks:
    - private
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:3000/api/health
      interval: 30s
      timeout: 3s
      retries: 5
networks:
  private:
    internal: true
  ingress: {}
volumes:
  postgres_data: {}
  postgres_socket: {}
  prometheus_data: {}
  grafana_data: {}
